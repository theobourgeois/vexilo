<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emblem review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #f4f3ef; --fg: #1d1e22; --muted: #6c6d73; --line: #dcdad3; --main: #1f3a68; --bad: #c0392b; --good: #1e7d4f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: var(--bg); color: var(--fg); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, .chip { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 11px; color: var(--fg); }
  .chip.on, button.on { background: var(--fg); color: #fff; border-color: var(--fg); }
  input[type=search] { font: inherit; width: 320px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; }
  .stats { color: var(--muted); margin-left: auto; }
  .help { color: var(--muted); font-size: 12px; }
  main { padding: 16px 20px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .art { position: relative; aspect-ratio: 1; display: grid; place-items: center; cursor: pointer; }
  .art img { max-width: 72%; max-height: 72%; object-fit: contain; }
  .art.light { background: #e9e8e4; } .art.mid { background: #b9bcc0; } .art.dark { background: #2a2b2f; }
  .card.out .art::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; color: var(--bad); background: rgba(255,255,255,.55); }
  .card.in .art::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; color: var(--good); background: rgba(255,255,255,.45); }
  .card.out { border-color: var(--bad); } .card.in { border-color: var(--good); }
  .meta { padding: 7px 9px 9px; display: grid; gap: 3px; }
  .name { font-weight: 600; outline: none; border-radius: 4px; }
  .tags { color: var(--muted); font-size: 11.5px; outline: none; border-radius: 4px; }
  .name:focus, .tags:focus { background: #fff7d6; }
  .edited { box-shadow: inset 2px 0 0 #e6a700; }
  .sub { color: var(--muted); font-size: 11px; display: flex; gap: 6px; justify-content: space-between; }
  .sub select { font: inherit; font-size: 11px; border: none; background: none; color: var(--muted); padding: 0; max-width: 60%; }
  .suggest { color: var(--bad); justify-content: flex-start; align-items: center; }
  .twin { width: 34px; height: 34px; object-fit: contain; flex: none; background: #b9bcc0; border-radius: 6px; padding: 2px; }
  .badge { font-size: 10px; padding: 0 5px; border-radius: 4px; background: #eceae4; color: var(--muted); }
  .badge.new { background: #dfeaf8; color: var(--main); }
  .more { grid-column: 1 / -1; text-align: center; padding: 20px; }
  @media (max-width: 640px) {
    header { position: static; padding: 10px 12px; gap: 8px; }
    h1 { width: 100%; }
    input[type=search] { width: 100%; }
    .stats { margin-left: 0; font-size: 12px; }
    #cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .chip { white-space: nowrap; }
    main { padding: 10px 12px 60px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Emblem review</h1>
    <span id="tabs"></span>
    <input id="q" type="search" placeholder="Search name, tags, flags… (try “star”)">
    <span class="stats" id="stats"></span>
    <button id="export">Download decisions</button>
  </div>
  <div class="row" id="cats"></div>
  <div class="help" id="help"></div>
  <div class="help" id="migration" hidden>Recommendations updated: distinct variants previously marked by default are restored. Additions, edits and other cuts are carried forward. <button id="previous">Download previous decisions</button></div>
</header>
<main id="grid"></main>
<script src="data.js"></script>
<script>
const KEY = 'vexilo-emblem-review-v3';
const LEGACY_KEY = 'vexilo-emblem-review-v2';
const state = { tab: 'library', cat: 'all', q: '', shown: 240 };
const suggestions = new Set(window.EMBLEMS.filter((e) => e.suggest).map((e) => e.id));
const legacyRaw = localStorage.getItem(LEGACY_KEY);
let saved = JSON.parse(localStorage.getItem(KEY) || 'null');
if (!saved && legacyRaw) {
  const legacy = JSON.parse(legacyRaw);
  const previousDefaults = new Set(window.LEGACY_SUGGESTIONS || []);
  const previousRejects = new Set(legacy.reject || []);
  // v2 mixed automatic marks with user clicks. Move known old defaults back into recommendations;
  // retain other rejects, explicit restores, additions and edits. Keep the original v2 file intact.
  saved = {
    reject: [...previousRejects].filter((id) => !previousDefaults.has(id)),
    keep: [...previousDefaults].filter((id) => !previousRejects.has(id)),
    add: legacy.add || [], edits: legacy.edits || {},
  };
}
saved ||= {};
const decisions = { reject: new Set(saved.reject || []), keep: new Set(saved.keep || []), add: new Set(saved.add || []), edits: saved.edits || {} };
const rejected = (e) => decisions.reject.has(e.id) || (suggestions.has(e.id) && !decisions.keep.has(e.id));
const save = () => localStorage.setItem(KEY, JSON.stringify({ reject: [...decisions.reject], keep: [...decisions.keep], add: [...decisions.add], edits: decisions.edits }));
if (legacyRaw) { document.getElementById('migration').hidden = false; save(); }
function download(value, filename) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 1)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const TABS = [
  ['library', 'Picked', 'Distinct variants are welcome: several fleurs-de-lis, maple leaves or sun faces can stay. Suggested cuts start with an ✕; click the art to keep or reject it. Names and tags are editable.'],
  ['bench', 'Runners-up', 'Outside the revised shortlist: lower-ranked candidates and duplicates flagged during tagging. A similar subject can still be a useful variant. Click the art to add one.'],
  ['rejected', 'Junk', 'Thrown out in triage (fragments, lettering, cantons, stripe offcuts, low quality). Click to rescue one.'],
];
const all = window.EMBLEMS;
const byTab = (tab) => all.filter((e) => e.tab === tab);
const field = (e, k) => (decisions.edits[e.id] && decisions.edits[e.id][k] !== undefined ? decisions.edits[e.id][k] : e[k]);

// The same ranking the editor will use: name, then tags, then flags.
function score(e, q) {
  if (!q) return 1;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  let total = 0;
  for (const w of words) {
    const name = field(e, 'name').toLowerCase();
    const tags = field(e, 'tags').map((t) => t.toLowerCase());
    let s = 0;
    if (new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`).test(name)) s = 4;
    else if (tags.some((t) => t === w)) s = 3.5;
    else if (tags.some((t) => t.startsWith(w))) s = 3;
    else if (name.includes(w) || tags.some((t) => t.includes(w))) s = 2;
    else if ((e.flags || []).some((f) => f.toLowerCase().includes(w))) s = 1;
    if (!s) return 0;
    total += s;
  }
  return total;
}

function tone(colors) {
  const lum = (h) => { const n = parseInt(h.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  if (!colors || !colors.length) return 'mid';
  const l = colors.reduce((s, c) => s + lum(c), 0) / colors.length;
  return l < 0.08 ? 'light' : l > 0.7 ? 'dark' : 'mid';
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function render() {
  const tab = TABS.find((t) => t[0] === state.tab);
  document.getElementById('help').textContent = tab[2];
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) => `<button data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${label} (${byTab(k).length})</button>`).join(' ');
  const pool = byTab(state.tab);
  const cats = [...new Set(pool.map((e) => field(e, 'category')))].sort();
  document.getElementById('cats').innerHTML = ['all', ...cats].map((c) => `<span class="chip ${state.cat === c ? 'on' : ''}" data-cat="${c}">${c === 'all' ? 'All' : c} ${c === 'all' ? pool.length : pool.filter((e) => field(e, 'category') === c).length}</span>`).join('');
  const list = pool
    .filter((e) => state.cat === 'all' || field(e, 'category') === state.cat)
    .map((e) => [e, score(e, state.q)])
    .filter(([, s]) => s > 0)
    .sort((a, b) => b[1] - a[1] || (b[0].rank ?? 0) - (a[0].rank ?? 0))
    .map(([e]) => e);
  const cuts = all.filter((e) => e.tab === 'library' && rejected(e)).length;
  const additions = all.filter((e) => e.tab !== 'library' && decisions.add.has(e.id)).length;
  const kept = byTab('library').length - cuts + additions;
  document.getElementById('stats').textContent = `${list.length} matches · library would have ${kept} · ${cuts} rejected, ${additions} added, ${Object.keys(decisions.edits).length} edited`;
  const categories = window.CATEGORIES;
  document.getElementById('grid').innerHTML = list.slice(0, state.shown).map((e) => {
    const cls = state.tab === 'library' ? (rejected(e) ? 'out' : '') : (decisions.add.has(e.id) ? 'in' : '');
    const edited = decisions.edits[e.id] ? 'edited' : '';
    return `<div class="card ${cls} ${edited}" data-id="${e.id}">
      <div class="art ${tone(e.colors)}" title="${esc((e.flags || []).join(' · '))}"><img loading="lazy" src="${e.thumb}" alt=""></div>
      <div class="meta">
        <div class="name" contenteditable="plaintext-only" data-edit="name">${esc(field(e, 'name') || e.flag)}</div>
        <div class="tags" contenteditable="plaintext-only" data-edit="tags">${esc(field(e, 'tags').join(', '))}</div>
        <div class="sub"><select data-edit="category">${categories.map((c) => `<option ${c === field(e, 'category') ? 'selected' : ''}>${c}</option>`).join('')}</select>
          <span>${e.origin === 'library' ? '<span class="badge">current</span>' : '<span class="badge new">new</span>'} ${e.count > 1 ? `×${e.count}` : ''}</span></div>
        <div class="sub"><span>${esc(e.flag)}</span>${e.reason ? `<span>${esc(e.reason)}</span>` : ''}</div>
        ${e.suggest ? `<div class="sub suggest">${e.twin ? `<img class="twin" src="${e.twin}" alt="">` : ''}<span>Suggested cut: ${esc(e.suggest)}</span></div>` : ''}
      </div></div>`;
  }).join('') + (list.length > state.shown ? `<div class="more"><button id="more">Show more (${list.length - state.shown} left)</button></div>` : '');
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-cat],.art,#more,#export,#previous');
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.cat = 'all'; state.shown = 240; }
  else if (t.dataset.cat) { state.cat = t.dataset.cat; state.shown = 240; }
  else if (t.id === 'more') { state.shown += 480; }
  else if (t.id === 'previous') { download(JSON.parse(legacyRaw), 'emblem-decisions-before-revision.json'); return; }
  else if (t.id === 'export') {
    download({ reject: byTab('library').filter(rejected).map((e) => e.id), add: all.filter((e) => e.tab !== 'library' && decisions.add.has(e.id)).map((e) => e.id), edits: decisions.edits }, 'emblem-decisions.json');
    return;
  } else {
    const id = t.closest('.card').dataset.id;
    if (state.tab === 'library') {
      const e = all.find((e) => e.id === id);
      if (rejected(e)) { decisions.reject.delete(id); decisions.keep.add(id); }
      else { decisions.keep.delete(id); decisions.reject.add(id); }
    } else {
      decisions.add.has(id) ? decisions.add.delete(id) : decisions.add.add(id);
    }
    save();
  }
  render();
});
document.addEventListener('focusout', (ev) => {
  const el = ev.target.closest('[data-edit]');
  if (!el || el.tagName === 'SELECT') return;
  const e = all.find((x) => x.id === el.closest('.card').dataset.id);
  const k = el.dataset.edit;
  const value = k === 'tags' ? el.textContent.split(',').map((s) => s.trim().toLowerCase()).filter(Boolean) : el.textContent.trim();
  if (JSON.stringify(value) === JSON.stringify(field(e, k))) return;
  decisions.edits[e.id] = { ...(decisions.edits[e.id] || {}), [k]: value };
  save(); render();
});
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('select[data-edit]');
  if (!el) return;
  const id = el.closest('.card').dataset.id;
  decisions.edits[id] = { ...(decisions.edits[id] || {}), category: el.value };
  save(); render();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.closest('[data-edit]')) { ev.preventDefault(); ev.target.blur(); } });
let timer;
document.getElementById('q').addEventListener('input', (ev) => { clearTimeout(timer); timer = setTimeout(() => { state.q = ev.target.value.trim(); state.shown = 240; render(); }, 120); });
render();
</script>
</body>
</html>
